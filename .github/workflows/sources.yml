name: Source links

# Every comic, site entry and pick links out to its original. Webcomic sites move,
# go quiet or disappear (Abstruse Goose did), so check those URLs weekly instead of
# on every push (external hosts are flaky).
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check links to the originals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Bot-hostile hosts answer 403/429 to CI runners; those are not dead links.
          # Small personal hosts time out from runners now and then, so allow 60s and retry.
          args: --no-progress --accept 200..=299,403,429 --max-concurrency 4 --timeout 60 --max-retries 4 --retry-wait-time 10 'src/data/**/*.json'
          fail: true
