name: Claude review

# A reviewer for what CI cannot see. The other workflows check lint, types,
# tests, data integrity, lettering overflow and a11y; this reads the diff for the
# things only a reader catches — a mistranslated balloon, a comic copied from a site
# whose terms do not allow it, a strip described as saying something it does not.
# It reviews, it does not gate: nothing here is a required check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. The cost is that a
# change to this file goes unreviewed by Claude until it is merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per pull request; a rapid re-push cancels the superseded run.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review the diff
    # Forks and Dependabot get no Actions secrets, so the run would fail on auth
    # rather than say anything useful; drafts wait until marked ready.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # post the summary and inline findings
      issues: read # the delivery check reads conversation comments
      id-token: write # the action's default GitHub App auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Without the token the action exits green having reviewed nothing, which
      # looks reviewed but is not. Fail here, where the reason is legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      # Anything the review posts must be newer than this, or it is a leftover
      # from an earlier push. Two minutes absorbs runner/API clock skew.
      - name: Mark the start of this review
        id: started
        run: echo "at=$(date -u -d '-2 minutes' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        id: claude
        with:
          # A subscription token, not an API key (runs against the Claude plan).
          # Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            wtfe2 is a bilingual (English default, Japanese at /ja/) static Astro site that
            introduces webcomics about software work. Comics under a Creative Commons license
            that allows adaptation (xkcd, TurnOff.us, Abstruse Goose) are shown with Japanese
            lettering: scripts/plates.ts erases the lettering inside each region's box from the
            original image, and src/components/ComicStage.astro sets the Japanese text over the
            cleaned plate. Every other site is described and linked only. Read README.md and
            CLAUDE.md first for the invariants.

            Do not repeat what a linter, tsc, vitest or axe would catch — CI already runs Biome,
            astro check, Vitest, markdownlint, a data-integrity job (scripts/validate-data.ts),
            Playwright with axe, and a lettering-overflow check. Look for what only a reader
            can catch:

            1. Licensing. Nothing from a site whose terms are not a Creative Commons license
               allowing adaptation may be copied into public/ or shown as an image. A new
               translated comic must carry the right license id, a link to the original, the
               author, and the image source URL. Flag any image, quote or excerpt that goes beyond
               what the site's quoted terms allow, and anything that adds ads, sponsorship or
               affiliate links (every comic here is non-commercial only).

            2. Translation fidelity. In src/data/comics/*.json, `en` must be the original
               lettering verbatim and `ja` a faithful translation of it: same joke, same
               speaker, no added or dropped claims. Flag a mistranslation, a lost pun that could
               have been kept, Japanese that reads as machine translation, or English left
               untranslated where a Japanese reader would stumble.

            3. Facts. Notes, site blurbs and picks must be accurate: creator names, dates,
               statuses, quotes of terms (verbatim), and descriptions of strips. A claim about a
               strip's content that the strip does not support is a defect.

            4. Regions and plates. A box that no longer matches the lettering in the image, an
               `erase: "rect"` that would wipe part of the drawing, or a `text` box that sets the
               Japanese over artwork rather than blank space.

            5. EN/JA parity. Every user-facing string exists in both languages with the same
               meaning (src/lib/i18n.ts, src/views/About.astro, the bilingual fields in data).

            Do not sign anything you post. No "Generated with" footer, no co-authored-by line,
            no self-attribution, in any comment. The review stands on the findings.

            Post findings as inline comments on the lines they concern, one top-level comment
            for the summary, each citing file:line. If the diff is clean against all of the
            above, say so in one line rather than manufacturing nits.

            Write the summary to a file and post it with `gh pr comment --body-file <path>`.
            A body built inline from a heredoc or command substitution does not match the
            allowlist and is refused, which loses the whole review.

          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Write,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Report the review outcome
        if: always()
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          echo "action conclusion: '${CONCLUSION}'"
          echo "execution file:    '${EXECUTION_FILE}'"
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            jq -r '[.. | objects | select(.type? == "result") | .permission_denials?]
              | map(select(. != null)) | last // [] | .[]
              | "denied: \(.tool_name // "?") \(.tool_input | tojson | .[0:200])"' \
              "$EXECUTION_FILE" 2>/dev/null || true
          fi

      # A review that runs, is refused a tool call on the way to posting, and
      # exits green leaves the PR unreviewed behind a passing check. Silence
      # alone is fine (nothing to add); silence WITH a refusal is the failure.
      - name: Fail on a review that was not delivered
        if: always() && steps.claude.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.started.outputs.at }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          BOT: claude[bot]
        run: |
          set -euo pipefail
          fresh() {
            gh api --paginate "$1" --jq \
              "[.[] | select(.user.login == \"$BOT\") | select((.$2 // \"\") >= \"$SINCE\")] | length" |
              awk '{ n += $1 } END { print n + 0 }'
          }
          summary=$(fresh "repos/$REPO/issues/$PR/comments" updated_at)
          inline=$(fresh "repos/$REPO/pulls/$PR/comments" updated_at)
          reviews=$(fresh "repos/$REPO/pulls/$PR/reviews" submitted_at)
          total=$((summary + inline + reviews))
          echo "posted since $SINCE: $summary summary, $inline inline, $reviews review(s)"
          if [ "$total" -gt 0 ]; then
            exit 0
          fi
          denials=unknown
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            denials=$(jq -r '[.. | objects | select(.type? == "result") | .permission_denials_count?]
              | map(select(. != null)) | last // 0' "$EXECUTION_FILE" 2>/dev/null || echo unknown)
          fi
          echo "denied tool calls: $denials"
          if [ "$denials" = "0" ]; then
            echo "::notice::The review posted nothing and nothing was refused, so it had nothing to add."
            exit 0
          fi
          echo "::error::The review ran, was refused a tool call ($denials), and posted nothing. Widen --allowedTools above."
          exit 1
